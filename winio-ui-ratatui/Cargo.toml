[package]
name = "winio-ui-ratatui"
version = "0.1.0"
description = "Ratatui backend for winio"
categories = ["asynchronous", "gui"]
keywords = ["async", "gui", "ratatui"]
edition = { workspace = true }
readme = { workspace = true }
license = { workspace = true }
repository = { workspace = true }

[dependencies]
winio-primitive = { workspace = true }
winio-handle = { workspace = true }
winio-pollable = { workspace = true }

compio = { workspace = true, default-features = false, optional = true }

ratatui = { version = "0.30", features = ["crossterm_0_29"] }
crossterm = "0.29"

cookie = { workspace = true, optional = true }
inherit-methods-macro = { workspace = true }
image = { workspace = true }
wgpu = { workspace = true, optional = true }

[features]
default = []
media = []
webview = ["dep:cookie"]
wgpu = ["dep:wgpu"]
compio-compat = ["compio/runtime", "compio/compat"]
