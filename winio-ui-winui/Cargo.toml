[package]
name = "winio-ui-winui"
version = "0.6.0"
description = "WinUI backend for winio."
edition = { workspace = true }
readme = { workspace = true }
license = { workspace = true }
repository = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
targets = ["x86_64-pc-windows-msvc"]

[target.'cfg(windows)'.dependencies]
winio-primitive = { workspace = true }
winio-handle = { workspace = true, features = ["winui"] }
winio-callback = { workspace = true }
winio-pollable = { workspace = true, features = ["callback"] }
winio-ui-windows-common = { workspace = true, features = ["winui"] }

compio = { workspace = true, default-features = false, optional = true }
compio-log = { workspace = true }

cookie = { workspace = true, optional = true }
futures-util = { workspace = true }
image = { workspace = true }
inherit-methods-macro = { workspace = true }
percent-encoding = { workspace = true, optional = true }
send_wrapper = { workspace = true }
time = { workspace = true, optional = true }

wgpu = { workspace = true, optional = true, features = ["dx12"] }

winui3 = { workspace = true }
windows-sys = { workspace = true, features = [
    "Win32_System_Diagnostics_Debug",
    "Win32_UI_HiDpi",
] }
windows-subset = { workspace = true }
windows-core = { workspace = true }
windows-reference = "0.100"

slim-detours-sys = { workspace = true }
sync-unsafe-cell = { workspace = true }

[features]
media = ["dep:percent-encoding"]
webview = ["dep:cookie", "dep:time"]
compio-compat = ["compio/compat-futures"]
wgpu = ["dep:wgpu"]

# Use CBS WinUI3 shipped with Windows
enable-cbs = []
# Use WebView2 Core shipped with Windows
webview-system = []
# Use ContentDialog for MessageBox
content-dialog = []

win32-dark-mode = ["winio-ui-windows-common/dark-mode"]
