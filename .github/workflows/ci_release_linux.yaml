name: Build Qt6

on:
  workflow_call:
  workflow_dispatch:

jobs:
  build:
    defaults:
      run:
        working-directory: ./winio-example

      matrix:
        include:
          - artifact: winio-exapmle-qt6-x86_64
            target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04

          - artifact: winio-exapmle-qt6-aarch64
            target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm

    name: ${{ matrix.artifact }}
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: ${{ matrix.target }}

      - name: Install Qt6
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            qt6-base-dev qt6-base-private-dev \
            qt6-multimedia-dev qt6-webengine-dev qmake6

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb

      - name: Build
        shell: bash
        run: |
          cargo build \
            --release \
            --target ${{ matrix.target }}
          cargo deb \
            --no-build \
            --target ${{ matrix.target }} \
            --output dist/${{ matrix.artifact }}.deb

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: dist/*
