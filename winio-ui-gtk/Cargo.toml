[package]
name = "winio-ui-gtk"
version = "0.7.0-beta.2"
description = "GTK backend for winio."
edition = { workspace = true }
readme = { workspace = true }
license = { workspace = true }
repository = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
targets = ["x86_64-unknown-linux-gnu"]

[target.'cfg(not(any(windows, target_vendor = "apple", target_os = "android")))'.dependencies]
winio-primitive = { workspace = true, features = ["bytemuck"] }
winio-handle = { workspace = true, features = ["gtk"] }
winio-callback = { workspace = true }
winio-pollable = { workspace = true, features = ["callback"] }
winio-wgpu = { workspace = true, optional = true, features = ["dmabuf", "memory"] }

compio = { workspace = true, default-features = false, optional = true }
compio-log = { workspace = true }

bytemuck = { workspace = true }
cookie = { workspace = true, optional = true }
futures-util = { workspace = true }
inherit-methods-macro = { workspace = true }
image = { workspace = true }
local-sync = { workspace = true, optional = true }
mime = { workspace = true }
scoped-tls = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true, optional = true }
wgpu = { workspace = true, optional = true, features = ["vulkan"] }

gtk4 = { workspace = true, features = ["v4_16"] }
glib-unix = { workspace = true, optional = true }
pangocairo = { workspace = true }
webkit6 = { workspace = true, optional = true, features = ["v2_42"] }

[features]
media = []
webview = ["dep:webkit6", "dep:cookie", "dep:time"]
wgpu = ["dep:wgpu", "dep:winio-wgpu"]
compio-compat = [
    "compio/runtime",
    "compio/compat",
    "dep:glib-unix",
    "dep:local-sync",
]
