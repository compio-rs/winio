[package]
name = "winio-layer-shell"
version = "0.1.0"
description = "Wayland layer shell support for winio."
categories = ["gui"]
keywords = ["gui", "wayland", "layer-shell"]
edition = { workspace = true }
readme = { workspace = true }
license = { workspace = true }
repository = { workspace = true }

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs"]
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]
winio-primitive = { workspace = true }
winio-handle = { workspace = true, default-features = false }

bitflags = { workspace = true }
cfg-if = { workspace = true }
thiserror = { workspace = true }

[target.'cfg(not(any(windows, target_vendor = "apple", target_os = "android")))'.dependencies]
gtk4-layer-shell = { workspace = true, features = ["v1_3"], optional = true }
cxx = { workspace = true, features = ["c++17"], optional = true }
gtk4 = { workspace = true, optional = true }

[dev-dependencies]
winio = { workspace = true, default-features = false }
anyhow = "1"

[build-dependencies]
cxx-build = { workspace = true }
qt-build-utils = { workspace = true }

[features]
default = ["qt"]
gtk = ["dep:gtk4", "dep:gtk4-layer-shell", "winio-handle/gtk", "winio/gtk"]
qt = ["dep:cxx", "winio-handle/qt", "winio/qt"]

[[example]]
name = "bar"
